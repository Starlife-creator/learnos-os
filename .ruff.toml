# P8（Tier C）：可选增量 lint 配置。
# 原则（对齐优化方案「避免历史告警风暴 / 不改老代码 / 零强制依赖」）：
# - 只保留「高价值、零存量噪声」规则：E9（语法/运行时错误）+ F821（未定义名）。
#   这两类在本次落地前的基线为 3 条 F821 真缺陷（已随 Tier C 修复），此后基线恒绿，
#   门禁只对增量生效。
# - F401（未用导入，存量 79 处）等清理型规则不启用：启用即需改写老代码（Out-of-Scope）。
# - ruff 仅 dev-only，不进运行路径（守零强制依赖红线）。
line-length = 100
target-version = "py311"

[lint]
select = ["E9", "F821"]
ignore = [
  "E501",  # 行长由 line-length 软约束；历史长行不主动改写（避免爆炸式 diff）
]
