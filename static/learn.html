<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>学习台 - 学习 OS</title>
<style>
  :root {
    --bg: #f4f7fb; --surface: #ffffff; --border: #e3e9f2;
    --text: #1f2d3d; --text-2: #5b6b82; --text-3: #8a99ad;
    --accent: #4f7cff; --green: #22c55e; --amber: #f59e0b; --red: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #2d3a50;
      --text: #e2e8f0; --text-2: #aab6c8; --text-3: #64748b;
      --accent: #6d8dff;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 16px; white-space: nowrap; }
  header a.back { font-size: 13px; color: var(--accent); text-decoration: none; white-space: nowrap; }
  select, input[type="text"], textarea {
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px;
    font-size: 13px; background: var(--bg); color: var(--text); outline: none;
  }
  select:focus, input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 5px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
  .spacer { flex: 1; }
  #wrap { display: flex; height: calc(100vh - 53px); }

  /* ── 左栏：教材列表 / 目录 / 搜索 ── */
  #left {
    width: 280px; min-width: 220px; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .col-head {
    padding: 10px 14px 6px; font-size: 12px; color: var(--text-3); font-weight: 600;
    letter-spacing: .05em; display: flex; align-items: center; gap: 6px;
  }
  #materialList { overflow-y: auto; padding: 0 8px 8px; max-height: 45%; }
  .mat-item {
    display: flex; align-items: center; gap: 6px; padding: 7px 10px; margin: 2px 0;
    border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .mat-item:hover { background: var(--bg); }
  .mat-item.active { background: rgba(79,124,255,.12); color: var(--accent); }
  .mat-item .fmt {
    font-size: 10px; padding: 1px 6px; border-radius: 6px; background: var(--bg);
    color: var(--text-3); text-transform: uppercase; flex-shrink: 0;
  }
  .mat-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mat-item .del {
    visibility: hidden; border: none; background: none; color: var(--text-3);
    cursor: pointer; font-size: 13px; padding: 0 2px;
  }
  .mat-item:hover .del { visibility: visible; }
  .mat-item .del:hover { color: var(--red); }
  #searchRow { padding: 6px 12px; display: flex; gap: 6px; }
  #searchBox { flex: 1; min-width: 0; }
  #searchResults { overflow-y: auto; padding: 4px 12px; font-size: 12px; }
  .sr-item { padding: 6px 0; border-bottom: 1px dashed var(--border); cursor: pointer; }
  .sr-item:hover .sr-title { color: var(--accent); }
  .sr-title { font-weight: 600; font-size: 12px; }
  .sr-snippet { color: var(--text-2); margin-top: 2px; line-height: 1.5; word-break: break-all; }
  #outline { overflow-y: auto; padding: 0 8px 12px; flex: 1; }
  .ol-item { display: block; padding: 4px 10px; border-radius: 6px; cursor: pointer;
             font-size: 12px; color: var(--text-2); text-decoration: none; }
  .ol-item:hover { background: var(--bg); color: var(--accent); }
  .ol-h2 { padding-left: 22px; }
  .ol-h3 { padding-left: 34px; }
  .muted { color: var(--text-3); font-size: 12px; padding: 8px 12px; }

  /* ── 中栏：阅读区 ── */
  #center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #readerScroll { flex: 1; overflow-y: auto; }
  #reader {
    max-width: 860px; margin: 0 auto; padding: 32px 40px 80px;
    line-height: 1.85; font-size: 15px; word-break: break-word;
  }
  #reader h1, #reader h2, #reader h3 { scroll-margin-top: 16px; margin: 1.4em 0 .6em; line-height: 1.4; }
  #reader h1 { font-size: 26px; } #reader h2 { font-size: 21px; } #reader h3 { font-size: 17px; }
  #reader p { margin: .7em 0; }
  #reader ul, #reader ol { padding-left: 1.8em; margin: .6em 0; }
  #reader li { margin: .25em 0; }
  #reader blockquote {
    border-left: 3px solid var(--accent); background: rgba(79,124,255,.06);
    padding: 8px 14px; margin: .8em 0; border-radius: 0 8px 8px 0; color: var(--text-2);
  }
  #reader pre {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; overflow-x: auto; margin: .9em 0; font-size: 13px; line-height: 1.6;
  }
  #reader code { background: rgba(127,142,163,.14); border-radius: 5px; padding: 1px 6px; font-size: .92em; }
  #reader pre code { background: none; padding: 0; }
  #reader img { max-width: 100%; border-radius: 8px; }
  #reader table { border-collapse: collapse; margin: .9em 0; width: 100%; }
  #reader td, #reader th { border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; }
  #reader a { color: var(--accent); }
  #reader hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }
  #readerPlaceholder {
    height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--text-3); font-size: 14px; flex-direction: column; gap: 10px;
  }

  /* ── 右栏：AI 助手 ── */
  #right {
    width: 340px; min-width: 260px; background: var(--surface);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
  }
  #chatBox { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; font-size: 13px; line-height: 1.65; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.ai.err { color: var(--red); border-color: var(--red); }
  .msg code { font-size: 12px; }
  #askRow { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  #askInput { flex: 1; resize: none; height: 60px; font-family: inherit; }
  #newMatForm { display: none; padding: 10px 12px; border-top: 1px solid var(--border); }
  #newMatForm.open { display: block; }
  #newMatForm textarea { width: 100%; height: 120px; margin-top: 6px; font-family: inherit; }
  #newMatForm input[type="text"] { width: 100%; }
  .hidden { display: none !important; }

  /* ── 划词弹层与批注（P0.5）── */
  #selPopup {
    position: fixed; z-index: 50; display: flex; gap: 2px; padding: 4px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.14);
  }
  #selPopup button {
    border: none; background: none; color: var(--text); font-size: 12px;
    padding: 5px 9px; border-radius: 7px; cursor: pointer; white-space: nowrap;
  }
  #selPopup button:hover { background: rgba(79,124,255,.12); color: var(--accent); }
  #reader mark.hl {
    background: rgba(255, 214, 79, .45); color: inherit; padding: 1px 0;
    border-radius: 3px; cursor: pointer; box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  #reader mark.hl:hover { background: rgba(255, 193, 7, .65); }
  #reader mark.hl.hl-note {
    background: rgba(79, 124, 255, .22);
    border-bottom: 2px dotted var(--accent);
  }
  #reader a.wikilink {
    color: var(--accent); text-decoration: none;
    border-bottom: 1px solid rgba(79,124,255,.4);
  }
  #reader a.wikilink:hover { border-bottom-color: var(--accent); }
  #reader span.wikilink.missing {
    color: var(--text-3); cursor: help;
    border-bottom: 1px dashed var(--text-3);
  }

  /* ── PDF 查看器（P1.5：canvas + textLayer 支持划词）── */
  #pdfViewer { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
  .pdf-page {
    position: relative; margin: 0 auto 18px; background: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); overflow: hidden;
  }
  .pdf-page canvas { display: block; }
  .pdf-page .loading { padding: 40px; text-align: center; color: #8a99ad; font-size: 13px; }
  .textLayer {
    position: absolute; inset: 0; overflow: hidden; line-height: 1;
    text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0;
  }
  .textLayer span, .textLayer br {
    color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%;
  }
  .textLayer ::selection { background: rgba(59,130,246,.35); }
  .textLayer mark.hl { background: rgba(255,214,79,.5); border-radius: 2px; }
  .textLayer mark.hl.hl-note { background: rgba(79,124,255,.25); border-bottom: 2px dotted var(--accent); }
  .pdf-toolbar {
    display: flex; align-items: center; gap: 4px; justify-content: center;
    padding: 6px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .pdf-tool {
    border: 1px solid var(--border); background: var(--bg); color: var(--text-2);
    font-size: 12px; padding: 3px 10px; border-radius: 7px; cursor: pointer;
  }
  .pdf-tool.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pdf-color { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; }
  .pdf-color.active { outline: 2px solid var(--text); }
  svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  svg.overlay [data-shape] { pointer-events: auto; cursor: pointer; }
  #todayReview .sr-item { display: flex; gap: 6px; align-items: baseline; }
  #todayReview .tr-kind { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: var(--bg); color: var(--text-3); flex-shrink: 0; }
</style>
</head>
<body>
<header>
  <a class="back" href="/">← 返回主页</a>
  <h1 data-i18n="learn.title">学习台</h1>
  <select id="subjectSel" aria-label="subject"></select>
  <span class="spacer"></span>
  <button class="btn btn-primary" onclick="pickUpload()" data-i18n="learn.upload">上传教材</button>
  <button class="btn" onclick="toggleNewForm()" data-i18n="learn.new">新建教材</button>
  <input type="file" id="fileInput" class="hidden" accept=".md,.markdown,.txt,.html,.htm,.pdf">
</header>

<div id="wrap">
  <aside id="left">
    <div class="col-head" data-i18n="learn.materials">教材</div>
    <div id="materialList"><div class="muted" data-i18n="learn.emptyMaterials">暂无教材，点击「上传教材」或「新建教材」开始</div></div>
    <div id="searchRow">
      <input type="text" id="searchBox" data-i18n-ph="learn.searchPh" placeholder="搜索教材全文…（≥2 字）">
    </div>
    <div id="searchResults"></div>
    <div id="todayReview"></div>
    <div class="col-head" data-i18n="learn.outline">目录</div>
    <div id="outline"><div class="muted" data-i18n="learn.outlineEmpty">打开教材后显示章节目录</div></div>
    <form id="newMatForm" onsubmit="return submitNew(event)">
      <input type="text" id="newTitle" data-i18n-ph="learn.newTitlePh" placeholder="教材标题">
      <textarea id="newContent" data-i18n-ph="learn.newBodyPh" placeholder="用 Markdown 书写正文…支持 $公式$ 与 ```代码块```"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button type="submit" class="btn btn-primary" style="flex:1" data-i18n="learn.saveNew">保存并打开</button>
        <button type="button" class="btn" onclick="aiGenerate()" data-i18n="learn.aiGen">AI 生成</button>
        <button type="button" class="btn" onclick="toggleNewForm()" data-i18n="learn.cancel">取消</button>
      </div>
    </form>
  </aside>

  <main id="center">
    <div id="readerScroll">
      <div id="readerPlaceholder"><span data-i18n="learn.placeholder">从左侧选择一本教材开始学习</span></div>
      <div id="reader" class="hidden"></div>
      <div id="pdfViewer" class="hidden"></div>
    </div>
  </main>

  <aside id="right">
    <div class="col-head" data-i18n="learn.assistant">AI 助手（可基于当前教材回答）</div>
    <div id="chatBox">
      <div class="msg ai" data-i18n="learn.aiGreet">你好！打开教材后可以问我关于内容的问题；划词功能将在后续版本提供。</div>
    </div>
    <div id="askRow">
      <textarea id="askInput" data-i18n-ph="learn.askPh" placeholder="问点什么…（Ctrl+Enter 发送）"></textarea>
      <button class="btn btn-primary" onclick="ask()" data-i18n="learn.send">发送</button>
    </div>
  </aside>
</div>

<div id="selPopup" class="hidden">
  <button onclick="actExplain()" data-i18n="learn.actExplain">解释</button>
  <button onclick="actCards()" data-i18n="learn.actCards">原子卡</button>
  <button onclick="actCloze()" data-i18n="learn.actCloze">挖空题</button>
  <button onclick="actHighlight()" data-i18n="learn.actHl">高亮</button>
  <button onclick="actNote()" data-i18n="learn.actNote">批注</button>
</div>

<script src="app-learn.js"></script>
</body>
</html>
