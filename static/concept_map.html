<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识图谱 - 物理学习</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f6f8fb; color: #1f2d3d; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 20px;
    background: #fff; border-bottom: 1px solid #e3e9f0;
  }
  header h1 { font-size: 16px; }
  header .hint { font-size: 12px; color: #7a8aa0; }
  #wrap { display: flex; height: calc(100vh - 49px); }
  #canvasBox {
    flex: 1; position: relative; overflow: hidden; background:
      radial-gradient(circle at 20% 20%, #eef3fa 0%, #f6f8fb 60%);
  }
  #svg { width: 100%; height: 100%; display: block; cursor: grab; }
  #svg.dragging { cursor: grabbing; }
  #side {
    width: 320px; background: #fff; border-left: 1px solid #e3e9f0;
    overflow-y: auto; padding: 16px;
  }
  .card { background: #fff; border: 1px solid #e3e9f0; border-radius: 10px; padding: 14px; }
  .card h3 { font-size: 15px; margin-bottom: 8px; }
  .kv { font-size: 13px; margin: 4px 0; color: #44546a; }
  .kv b { color: #1f2d3d; }
  .bar { height: 8px; background: #e9eef5; border-radius: 4px; margin-top: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #3b82f6, #22c55e); }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 8px; margin: 2px 2px 0 0; }
  .tag-warn { background: #fef3c7; color: #92400e; }
  .tag-ok { background: #dcfce7; color: #166534; }
  .tag-mid { background: #fde8e8; color: #991b1b; }
  .btn {
    border: 1px solid #cbd5e1; background: #fff; color: #1f2d3d;
    padding: 5px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .btn:hover { background: #f1f5f9; }
  .btn-primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-sm { padding: 3px 9px; font-size: 12px; }
  .hidden { display: none; }
  #problemList { list-style: none; }
  #problemList li { font-size: 13px; padding: 7px 0; border-bottom: 1px dashed #e8edf4; }
  #problemList li:last-child { border-bottom: none; }
  .muted { color: #7a8aa0; font-size: 12px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: #44546a; align-items: center; }
  .legend .ln { display: inline-flex; align-items: center; gap: 4px; }
  .legend .ln i { width: 18px; height: 0; display: inline-block; border-top: 2px solid; }
  #addForm { display: flex; gap: 8px; margin-top: 10px; }
  #addForm input { flex: 1; padding: 5px 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
  .node-unit { fill: #eef2ff; stroke: #6366f1; }
  .node-chapter { fill: #eff6ff; stroke: #3b82f6; }
  .node-concept { fill: #f0fdf4; stroke: #22c55e; }
  .node-unit:hover, .node-chapter:hover, .node-concept:hover { stroke-width: 2.5; }
  .label { font-size: 11px; fill: #334155; pointer-events: none; }
  .edge-prereq { stroke: #f87171; stroke-dasharray: 5 3; }
  .edge-related { stroke: #60a5fa; }
  .edge-contrast { stroke: #fb923c; stroke-dasharray: 2 2; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="graph.title">概念知识图谱</h1>
  <div class="legend">
    <span class="ln"><i style="border-color:#f87171"></i><span data-i18n="graph.tagPrereq">先修</span></span>
    <span class="ln"><i style="border-color:#60a5fa"></i><span data-i18n="graph.tagRelated">相关</span></span>
    <span class="ln"><i style="border-color:#fb923c"></i><span data-i18n="graph.tagContrast">对比</span></span>
  </div>
  <div class="hint" data-i18n="graph.zoom">滚轮缩放 · 拖拽平移 · 点击概念查看掌握度与先修错题</div>
</header>
<div id="wrap">
  <div id="canvasBox">
    <svg id="svg"></svg>
  </div>
  <div id="side">
    <div id="welcome" class="card">
      <h3 data-i18n="graph.usageTitle">使用说明</h3>
      <p class="kv" data-i18n="graph.usage">点击左侧任意节点查看详情。概念节点颜色深浅表示掌握度：</p>
      <p class="kv"><span class="tag tag-ok" data-i18n="graph.tagOk">绿 = 掌握良好</span></p>
      <p class="kv"><span class="tag tag-warn" data-i18n="graph.tagWarn">黄 = 仍需巩固</span></p>
      <p class="kv"><span class="tag tag-mid" data-i18n="graph.tagMid">红 = 先修不足</span></p>
    </div>
    <div id="detail" class="card hidden">
      <h3 id="dTitle"></h3>
      <p class="kv"><b data-i18n="graph.level">层级：</b><span id="dLevel"></span></p>
      <p class="kv"><b data-i18n="graph.diff">难度：</b><span id="dDiff"></span></p>
      <p class="kv"><b data-i18n="graph.mastery">掌握度：</b><span id="dMastery"></span>
        <span class="bar"><i id="dBar" style="width:0%"></i></span></p>
      <p class="kv"><b data-i18n="graph.looms">绑定错题：</b><span id="dLooms"></span></p>
      <div id="dPrereq"></div>
      <div class="flex" style="display:flex; gap:8px; margin-top:10px">
        <button class="btn btn-primary btn-sm" onclick="prereqMode()" data-i18n="graph.prereqBtn">先修模式：看相关错题</button>
      </div>
      <div id="dProblems"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h3 data-i18n="graph.addTitle">添加概念</h3>
      <p class="muted" data-i18n="graph.addHint">父节点留空则加为顶级单元；可粘贴章节名作父节点</p>
      <div id="addForm">
        <input id="newName" placeholder="概念名" data-i18n-ph="graph.namePh">
        <input id="newParent" placeholder="父节点ID(可选)" data-i18n-ph="graph.parentPh">
      </div>
      <button class="btn btn-sm" style="margin-top:8px" onclick="addConcept()" data-i18n="graph.add">添加</button>
    </div>
  </div>
</div>
<script>
// ── F2 双语：静态独立页轻度 i18n ──
const GRAPH_LOCALES = ['zh-CN', 'en-US'];
let _dict = {};
function _curLang() {
  const s = localStorage.getItem('lang');
  return GRAPH_LOCALES.includes(s) ? s : 'zh-CN';
}
function t(k, fb) { return _dict[k] || fb || k; }
function applyGraphI18n(root) {
  const scope = root || document;
  scope.querySelectorAll('[data-i18n]').forEach(el => {
    const text = t(el.getAttribute('data-i18n'));
    if (String(text)) el.textContent = text;
  });
  scope.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
  });
  if (scope === document) document.title = t('graph.title') + ' - Physics';
}
async function bootGraph() {
  const lang = _curLang();
  try {
    _dict = await (await fetch(`/locale/${lang}.json`, { cache: 'no-cache' })).json();
  } catch { _dict = {}; }
  applyGraphI18n(document);
  loadGraph();
}
const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
let graphData = null;
let selectedId = null;
let view = { x: 40, y: 30, scale: 1 };

function make(tag, attrs, text) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (text !== undefined) el.textContent = text;
  return el;
}

function nodeColor(m) {
  if (!m || m <= 0.01) return '#cbd5e1';
  if (m >= 0.6) return '#22c55e';
  if (m >= 0.35) return '#eab308';
  return '#ef4444';
}

async function loadGraph() {
  const resp = await fetch('/api/graph/concepts');
  graphData = await resp.json();
  if (graphData.nodes.length === 0) { toastErr(t('graph.empty')); return; }
  draw();
}

function layoutNodes(nodes) {
  const units = nodes.filter(n => n.level === 0);
  const chapters = nodes.filter(n => n.level === 1);
  const concepts = nodes.filter(n => n.level === 2);
  const pos = new Map();
  const W = 1500, H = 700;
  const gapU = 80, gapC = 24, gapK = 26;
  // 单元列排布（垂直居中）
  const totalU = units.length;
  let yU = (H - (totalU - 1) * gapU) / 2;
  for (const u of units) { pos.set(u.id, { x: 60, y: yU }); yU += gapU; }
  // 每单元内章节垂直堆叠，概念水平延伸
  for (const u of units) {
    const chs = chapters.filter(c => c.parent_id === u.id);
    if (chs.length === 0) continue;
    let y = pos.get(u.id).y - ((chs.length - 1) * 60) / 2;
    for (const ch of chs) {
      pos.set(ch.id, { x: 240, y: y });
      const kids = concepts.filter(c => c.parent_id === ch.id);
      const n = Math.max(1, kids.length);
      const startX = 380;
      const stepX = 110;
      const startY = y - ((n - 1) * gapK) / 2;
      let xi = 0;
      for (const k of kids) {
        pos.set(k.id, { x: startX + xi * stepX, y: startY + xi * gapK });
        xi++;
      }
      y += 60;
    }
  }
  return pos;
}

let renderCache = null;
function draw() {
  if (renderCache) { renderCache.forEach(el => el.remove()); renderCache = null; }
  renderCache = [];
  const pos = layoutNodes(graphData.nodes);
  const gMain = make('g');
  const gEdges = make('g');
  const gNodes = make('g');
  gMain.appendChild(gEdges);
  gMain.appendChild(gNodes);
  svg.appendChild(gMain);
  renderCache.push(gMain);
  const dim = { W: 1500, H: 700 };

  // 边
  for (const l of graphData.links) {
    const a = pos.get(l.concept_a), b = pos.get(l.concept_b);
    if (!a || !b) continue;
    const line = make('line', {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      class: 'edge-' + l.relation, 'stroke-width': 1.4, opacity: 0.7,
    });
    gEdges.appendChild(line);
    renderCache.push(line);
  }

  // 节点
  const byId = new Map(graphData.nodes.map(n => [n.id, n]));
  for (const n of graphData.nodes) {
    const p = pos.get(n.id);
    if (!p) continue;
    const cls = n.level === 0 ? 'node-unit' : n.level === 1 ? 'node-chapter' : 'node-concept';
    const r = n.level === 0 ? 22 : n.level === 1 ? 15 : 10;
    const circle = make('circle', {
      cx: p.x, cy: p.y, r: r, class: cls,
      'data-id': n.id,
    });
    const col = nodeColor(n.mastery_est || 0);
    if (n.level === 2) {
      circle.setAttribute('fill', col);
      circle.setAttribute('fill-opacity', '0.85');
    }
    circle.addEventListener('click', () => selectNode(n.id));
    gNodes.appendChild(circle);
    renderCache.push(circle);
    const label = make('text', {
      x: p.x, y: p.y + (n.level === 2 ? 24 : 34), 'text-anchor': 'middle', class: 'label',
    }, n.name);
    gNodes.appendChild(label);
    renderCache.push(label);
    if (n.level === 0) {
      const unitLabel = make('text', { x: p.x, y: p.y, 'text-anchor': 'middle', 'font-size': '10px', fill: '#4338ca', 'font-weight': 'bold' }, n.name);
      gNodes.appendChild(unitLabel);
      renderCache.push(unitLabel);
    }
  }
  applyView();
  void dim;
}

function applyView() {
  const g = svg.firstElementChild;
  if (!g) return;
  g.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.scale})`);
}

// 缩放 / 平移
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  view.scale = Math.min(2.5, Math.max(0.4, view.scale * factor));
  applyView();
}, { passive: false });

let dragStart = null;
svg.addEventListener('mousedown', e => {
  if (e.target.tagName === 'circle') return;
  dragStart = { x: e.clientX, y: e.clientY };
  svg.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!dragStart) return;
  view.x += e.clientX - dragStart.x;
  view.y += e.clientY - dragStart.y;
  dragStart = { x: e.clientX, y: e.clientY };
  applyView();
});
window.addEventListener('mouseup', () => { dragStart = null; svg.classList.remove('dragging'); });

async function selectNode(id) {
  selectedId = id;
  const n = graphData.nodes.find(x => x.id === id);
  if (!n) return;
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('detail').classList.remove('hidden');
  document.getElementById('dTitle').textContent = n.name;
  const levelName = n.level === 0 ? t('graph.unit') : n.level === 1 ? t('graph.chapter') : t('graph.concept');
  document.getElementById('dLevel').textContent = levelName;
  document.getElementById('dDiff').textContent = n.difficulty;
  const m = (n.mastery_est || 0);
  document.getElementById('dMastery').textContent = Math.round(m * 100) + '%';
  document.getElementById('dBar').style.width = Math.round(m * 100) + '%';
  document.getElementById('dLooms').textContent = n.looms_in || 0;
  // 先修 / 后续 / 对比
  const byId = new Map(graphData.nodes.map(x => [x.id, x]));
  const prereq = graphData.links.filter(l => l.concept_b === id && l.relation === 'prerequisite').map(l => byId.get(l.concept_a));
  const succ = graphData.links.filter(l => l.concept_a === id && l.relation === 'prerequisite').map(l => byId.get(l.concept_b));
  const cont = graphData.links.filter(l => (l.concept_a === id || l.concept_b === id) && l.relation === 'contrast').map(l => byId.get(l.concept_a === id ? l.concept_b : l.concept_a));
  const dPrereq = document.getElementById('dPrereq');
  dPrereq.innerHTML = '';
  if (prereq.length) dPrereq.innerHTML += `<p class="kv"><b data-i18n="graph.prereq">先修：</b>${prereq.map(p => p.name).join('、')}</p>`;
  if (succ.length) dPrereq.innerHTML += `<p class="kv"><b data-i18n="graph.succ">后续：</b>${succ.map(s => s.name).join('、')}</p>`;
  if (cont.length) dPrereq.innerHTML += `<p class="kv"><b data-i18n="graph.contrast">对比：</b>${cont.map(c => c.name).join('、')}</p>`;
  document.getElementById('dProblems').innerHTML = '';
  if (n.level === 2) loadRelatedProblems(id);
}

async function loadRelatedProblems(id) {
  const el = document.getElementById('dProblems');
  el.innerHTML = '<p class="muted">' + t('msg.loading') + '</p>';
  try {
    // B4 语义修正：展示「绑定该概念 + 先修链」上的历史错题，
    // 而非同课程题目（/api/graph/problems?concept= 与先修模式同源）
    const resp = await fetch(`/api/graph/problems?concept=${id}`);
    const items = await resp.json();
    el.innerHTML = items.length
      ? '<p class="muted">' + t('graph.relatedLabel') + '</p><ul id="problemList">' + items.map(p =>
          `<li>${p.title}（${t('graph.masteryOf')} ${p.mastery}/5）</li>`).join('') + '</ul>'
      : '<p class="muted">' + t('graph.noRelated') + '</p>';
  } catch { el.innerHTML = '<p class="muted">' + t('graph.loadFail') + '</p>'; }
}

function prereqMode() {
  const cid = selectedId;
  window.open(`/#page-problems?prereq=${cid}`, '_blank');
}

async function addConcept() {
  const name = document.getElementById('newName').value.trim();
  const parent = document.getElementById('newParent').value.trim();
  if (!name) return;
  const resp = await fetch('/api/graph/concepts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'PhysicsStudyOS' },
    body: JSON.stringify({ name, parent_id: parent ? parseInt(parent, 10) : 0 }),
  });
  const data = await resp.json();
  if (!resp.ok) { toastErr(data.error || t('graph.addFail')); return; }
  document.getElementById('newName').value = '';
  document.getElementById('newParent').value = '';
  await loadGraph();
}

function toastErr(msg) {
  alert(msg);
}

bootGraph();
</script>
</body>
</html>
