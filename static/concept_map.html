<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>知识图谱 - 学习 OS</title>
<style>
  :root {
    --bg: #f4f7fb; --surface: #ffffff; --border: #e3e9f2;
    --text: #1f2d3d; --text-2: #5b6b82; --text-3: #8a99ad;
    --accent: #4f7cff; --green: #22c55e; --amber: #f59e0b; --red: #ef4444; --gray: #cbd5e1;
    --unit-colors: #6366f1, #0ea5e9, #10b981, #f59e0b, #ec4899;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #2d3a50;
      --text: #e2e8f0; --text-2: #aab6c8; --text-3: #64748b;
      --accent: #6d8dff; --gray: #475569;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 18px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; }
  .hint { font-size: 12px; color: var(--text-3); }
  .spacer { flex: 1; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--text-2); align-items: center; flex-wrap: wrap; }
  .legend .ln { display: inline-flex; align-items: center; gap: 4px; }
  .legend .ln i { width: 18px; height: 0; display: inline-block; border-top: 2px solid; }
  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 4px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  #wrap { display: flex; height: calc(100vh - 52px); }
  #canvasBox {
    flex: 1; position: relative; overflow: hidden;
    background:
      radial-gradient(1200px 600px at 15% 10%, rgba(79,124,255,.07), transparent 60%),
      radial-gradient(1000px 500px at 85% 90%, rgba(16,185,129,.06), transparent 60%),
      var(--bg);
  }
  #canvasBox::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  #svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #svg.dragging { cursor: grabbing; }
  .node-hit { fill: transparent; pointer-events: all; cursor: move; }
  #searchWrap {
    position: absolute; top: 14px; left: 14px; z-index: 5;
    display: flex; align-items: center; gap: 8px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06); min-width: 220px;
  }
  #searchInput { border: none; outline: none; background: transparent; color: var(--text); font-size: 13px; flex: 1; }
  #side {
    width: 320px; background: var(--surface); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 16px;
  }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .card h3 { font-size: 14px; margin-bottom: 8px; }
  .kv { font-size: 13px; margin: 4px 0; color: var(--text-2); }
  .kv b { color: var(--text); }
  .bar { height: 8px; background: var(--border); border-radius: 4px; margin-top: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--red), var(--amber), var(--green)); }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 8px; margin: 2px 2px 0 0; }
  .tag-warn { background: rgba(245,158,11,.16); color: var(--amber); }
  .tag-ok { background: rgba(34,197,94,.16); color: var(--green); }
  .tag-mid { background: rgba(239,68,68,.16); color: var(--red); }
  .hidden { display: none; }
  #problemList { list-style: none; }
  #problemList li { font-size: 13px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  #problemList li:last-child { border-bottom: none; }
  .muted { color: var(--text-3); font-size: 12px; }
  #addForm { display: flex; gap: 8px; margin-top: 10px; }
  #addForm input { flex: 1; padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--bg); color: var(--text); }
  .node-unit { stroke: var(--accent); }
  .node-chapter { stroke: var(--text-2); }
  .node-concept { stroke: #fff; }
  .node-dim { opacity: .25; }
  .label { font-size: 11px; fill: var(--text-2); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; user-select: none; }
  .label-search { font-weight: 700; fill: var(--accent); }
  .label-chapter { font-size: 12px; font-weight: 600; fill: var(--text); }
  .label-unit { font-size: 14px; font-weight: 700; fill: var(--accent); }
  .edge { fill: none; opacity: .55; }
  .edge-prerequisite { stroke: var(--red); stroke-dasharray: 5 3; }
  .edge-related { stroke: var(--accent); }
  .edge-contrast { stroke: var(--amber); stroke-dasharray: 2 2; }
  #zoomHints {
    position: absolute; right: 14px; top: 14px; z-index: 5; display: flex; flex-direction: column; gap: 6px;
  }
  #zoomHints .btn { width: 30px; padding: 3px 0; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="graph.title">概念知识图谱</h1>
  <div class="legend">
    <span class="ln"><i style="border-color:var(--red)"></i><span data-i18n="graph.tagPrereq">先修</span></span>
    <span class="ln"><i style="border-color:var(--accent)"></i><span data-i18n="graph.tagRelated">相关</span></span>
    <span class="ln"><i style="border-color:var(--amber)"></i><span data-i18n="graph.tagContrast">对比</span></span>
    <span class="ln"><i style="background:var(--gray);width:10px;height:10px;border-radius:50%;border-top:none"></i><span data-i18n="graph.tagMid">未学/薄弱</span></span>
  </div>
  <div class="hint" data-i18n="graph.zoom">点击章节展开/收起概念 · 拖动节点调整位置（自动保存）· 滚轮缩放 · 空白拖拽平移</div>
  <div class="spacer"></div>
  <label for="graphSubject" data-i18n="nav.subject" style="margin-right:6px;font-size:14px">学科</label>
  <select id="graphSubject" onchange="switchGraphSubject(this.value)" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;margin-right:10px"></select>
  <button class="btn" onclick="collapseAll()" data-i18n="graph.collapseAll">全部收起</button>
  <button class="btn" onclick="expandAll()" data-i18n="graph.expandAll">全部展开</button>
  <button class="btn" onclick="autoLayout()" data-i18n="graph.autoLayout">整理布局</button>
  <button class="btn" onclick="resetLayout()" data-i18n="graph.resetLayout">重置布局</button>
</header>
<div id="wrap">
  <div id="canvasBox">
    <div id="searchWrap">
      <span>🔍</span>
      <input id="searchInput" data-i18n-ph="graph.searchPh" placeholder="搜索概念名..." oninput="applySearch(this.value)">
    </div>
    <div id="zoomHints">
      <button class="btn" title="+" onclick="zoomBy(1.2)">+</button>
      <button class="btn" title="−" onclick="zoomBy(1/1.2)">−</button>
      <button class="btn" title="适应" onclick="fitToView()">⛶</button>
    </div>
    <svg id="svg"></svg>
  </div>
  <div id="side">
    <div id="welcome" class="card">
      <h3 data-i18n="graph.usageTitle">使用说明</h3>
      <p class="kv" data-i18n="graph.usage">默认显示单元与章节：点击章节展开其下概念，再次点击收起。节点颜色表示掌握度：</p>
      <p class="kv"><span class="tag tag-ok" data-i18n="graph.tagOk">绿 = 掌握良好</span></p>
      <p class="kv"><span class="tag tag-warn" data-i18n="graph.tagWarn">黄 = 仍需巩固</span></p>
      <p class="kv"><span class="tag tag-mid" data-i18n="graph.tagMid">红/灰 = 未学或先修不足</span></p>
      <p class="muted" style="margin-top:8px" data-i18n="graph.dragHint">拖动节点可调整位置，布局自动保存在本机浏览器</p>
    </div>
    <div id="detail" class="card hidden">
      <h3 id="dTitle"></h3>
      <p class="kv"><b data-i18n="graph.level">层级：</b><span id="dLevel"></span></p>
      <p class="kv"><b data-i18n="graph.diff">难度：</b><span id="dDiff"></span></p>
      <p class="kv"><b data-i18n="graph.mastery">掌握度：</b><span id="dMastery"></span>
        <span class="bar"><i id="dBar" style="width:0%"></i></span></p>
      <p class="kv"><b data-i18n="graph.looms">绑定错题：</b><span id="dLooms"></span></p>
      <div id="dPrereq"></div>
      <p class="kv" style="margin-top:8px"><b data-i18n="graph.aliases">别名：</b></p>
      <div style="display:flex; gap:8px">
        <input id="dAliases" placeholder="N2L,F=ma" data-i18n-ph="graph.aliasPh" style="flex:1">
        <button class="btn" onclick="saveAliases()" data-i18n="graph.aliasSave">保存</button>
      </div>
      <p class="kv" style="margin-top:10px"><b data-i18n="graph.explanation">详解：</b></p>
      <textarea id="dExplanation" data-i18n-ph="graph.explanationPh" placeholder="概念释义，可手填或用 AI 生成"
        rows="4" style="width:100%;resize:vertical;font:inherit"></textarea>
      <div style="display:flex; gap:8px; margin-top:6px">
        <button class="btn" onclick="saveExplanation()" data-i18n="graph.explainSave">保存详解</button>
        <button class="btn btn-primary" id="btnGenExplain" onclick="generateExplanation()" data-i18n="graph.explainGen">AI 生成详解</button>
      </div>
      <div style="display:flex; gap:8px; margin-top:10px">
        <button class="btn btn-primary" onclick="prereqMode()" data-i18n="graph.prereqBtn">先修模式：看相关错题</button>
      </div>
      <div id="dProblems"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h3 data-i18n="graph.addTitle">添加概念</h3>
      <p class="muted" data-i18n="graph.addHint">父节点留空则加为顶级单元；可粘贴章节名作父节点</p>
      <div id="addForm">
        <input id="newName" placeholder="概念名" data-i18n-ph="graph.namePh">
        <input id="newParent" placeholder="父节点ID(可选)" data-i18n-ph="graph.parentPh">
      </div>
      <button class="btn" style="margin-top:8px" onclick="addConcept()" data-i18n="graph.add">添加</button>
    </div>
  </div>
</div>
<script src="concept_map.js"></script>
</body>
</html>
