<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人物理学习 OS</title>
<link rel="stylesheet" href="/vendor/katex.min.css">
<script defer src="/vendor/katex.min.js"></script>
<script defer src="/vendor/auto-render.min.js"></script>
<script defer src="/app.js"></script>
<style>
  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --border: #e2e6ea;
    --text: #1a1a2e;
    --text-2: #6c757d;
    --accent: #3b82f6;
    --accent-light: #dbeafe;
    --danger: #ef4444;
    --danger-light: #fee2e2;
    --success: #10b981;
    --success-light: #d1fae5;
    --warning: #f59e0b;
    --warning-light: #fef3c7;
    --radius: 10px;
    --mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --surface: #1e2027;
      --border: #33363f;
      --text: #e8eaed;
      --text-2: #9aa0aa;
      --accent: #60a5fa;
      --accent-light: #1e3a5f;
      --danger: #f87171;
      --danger-light: #3a1d1d;
      --success: #34d399;
      --success-light: #14342a;
      --warning: #fbbf24;
      --warning-light: #3a2e10;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; transition: background .2s, color .2s; }
  a { color: var(--accent); text-decoration: none; }

  /* ── 导航 ── */
  .nav { display: flex; gap: 0; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .nav-item { padding: 14px 22px; cursor: pointer; border-bottom: 2px solid transparent; font-size: 14px; font-weight: 500; color: var(--text-2); transition: all .15s; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; }
  .nav-item:hover { color: var(--text); background: var(--bg); }
  .nav-item.active { color: var(--accent); border-bottom-color: var(--accent); }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-brand { margin-right: auto; padding: 14px 22px; font-weight: 700; font-size: 16px; color: var(--text); display: flex; align-items: center; gap: 10px; }
  .theme-toggle { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text-2); padding: 4px; }

  /* ── 布局 ── */
  .container { max-width: 960px; margin: 0 auto; padding: 24px 20px; }
  .page { display: none; }
  .page.active { display: block; }

  /* ── 卡片 ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; }

  /* ── 统计卡片 ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 12px; color: var(--text-2); margin-top: 4px; }

  /* ── 表单 ── */
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--text-2); }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text);
    transition: border-color .15s;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
  .form-group textarea { min-height: 80px; resize: vertical; font-family: var(--mono); font-size: 13px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint-text { font-size: 12px; color: var(--text-2); margin-top: 4px; }

  /* ── 按钮 ── */
  .btn { display: inline-block; padding: 8px 18px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s; font-family: inherit; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(0.92); }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--bg); }
  .btn-danger { background: var(--danger-light); color: var(--danger); }
  .btn-danger:hover { filter: brightness(0.95); }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── 列表 ── */
  .list-item { padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: all .15s; }
  .list-item:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(59,130,246,.1); }
  .list-item-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .list-item-title { font-weight: 500; font-size: 14px; }
  .list-item-meta { font-size: 12px; color: var(--text-2); margin-top: 4px; }

  /* ── 标签 ── */
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .tag-blue { background: var(--accent-light); color: var(--accent); }
  .tag-green { background: var(--success-light); color: var(--success); }
  .tag-red { background: var(--danger-light); color: var(--danger); }
  .tag-amber { background: var(--warning-light); color: var(--warning); }
  .tag-gray { background: var(--border); color: var(--text-2); }

  /* ── 提示卡片 ── */
  .hint-card { padding: 16px; border-left: 3px solid var(--accent); background: var(--accent-light); border-radius: 0 8px 8px 0; margin-bottom: 10px; }
  .hint-card h4 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  .hint-card p { font-size: 14px; white-space: pre-wrap; }

  /* ── 掌握度 ── */
  .mastery-bar { display: flex; gap: 3px; }
  .mastery-dot { width: 18px; height: 6px; border-radius: 3px; background: var(--border); }
  .mastery-dot.filled { background: var(--success); }

  /* ── 口试 ── */
  .chat-box { max-height: 400px; overflow-y: auto; padding: 12px; background: var(--bg); border-radius: 8px; margin-bottom: 12px; }
  .chat-msg { margin-bottom: 10px; max-width: 80%; }
  .chat-msg.assistant { }
  .chat-msg.user { margin-left: auto; text-align: right; }
  .chat-msg .bubble { display: inline-block; padding: 8px 14px; border-radius: 12px; font-size: 14px; }
  .chat-msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); }
  .chat-msg.user .bubble { background: var(--accent); color: #fff; }
  .chat-msg.thinking .bubble { background: var(--surface); border: 1px dashed var(--border); color: var(--text-2); font-style: italic; }

  /* ── 空状态 / 加载 ── */
  .empty { text-align: center; padding: 40px 20px; color: var(--text-2); }
  .empty p { font-size: 14px; }
  .loading { text-align: center; padding: 24px; color: var(--text-2); font-size: 14px; }
  .skeleton { height: 60px; border-radius: 8px; background: linear-gradient(90deg, var(--surface), var(--border), var(--surface)); background-size: 200% 100%; animation: shimmer 1.2s infinite; margin-bottom: 8px; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* ── 弹窗 ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; display: none; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; padding: 24px; width: 90%; max-width: 560px; max-height: 85vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h3 { font-size: 16px; }
  .modal-close { cursor: pointer; font-size: 20px; color: var(--text-2); border: none; background: none; }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 300; animation: slideIn .3s; max-width: 80vw; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .flex { display: flex; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .gap-8 { gap: 8px; }
  .gap-12 { gap: 12px; }
  .mt-12 { margin-top: 12px; }
  .mt-16 { margin-top: 16px; }
  .mb-8 { margin-bottom: 8px; }
  .text-sm { font-size: 13px; }
  .text-muted { color: var(--text-2); }
  .text-mono { font-family: var(--mono); }
  .hidden { display: none !important; }

  /* ── 趋势图 ── */
  .trend-svg { width: 100%; height: 120px; }

  /* ── 响应式 ── */
  @media (max-width: 640px) {
    .nav { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .nav-item { padding: 12px 14px; white-space: nowrap; font-size: 13px; }
    .nav-brand { padding: 12px 14px; font-size: 14px; }
    .container { padding: 16px 12px; }
    .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card { padding: 12px; }
    .stat-value { font-size: 22px; }
    .form-row { grid-template-columns: 1fr; gap: 12px; }
    .modal { width: 95%; padding: 16px; border-radius: 8px; }
    .card { padding: 14px; }
    .chat-msg { max-width: 95%; }
    .btn { padding: 10px 16px; min-height: 44px; }
    .btn-sm { padding: 8px 12px; min-height: 36px; }
    .flex-between { flex-direction: column; align-items: flex-start; gap: 8px; }
    .flex { flex-wrap: wrap; }
    .gap-12 { gap: 8px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">物理学习 OS
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色模式" title="切换主题">🌓</button>
  </div>
  <button class="nav-item active" data-page="dashboard">概览</button>
  <button class="nav-item" data-page="problems">错题</button>
  <button class="nav-item" data-page="review">复习</button>
  <button class="nav-item" data-page="oral">口试</button>
  <button class="nav-item" data-page="settings">设置</button>
</nav>

<div class="container">

  <!-- ── 概览页 ── -->
  <div id="page-dashboard" class="page active">
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-value" id="statTotal">-</div><div class="stat-label">题目总数</div></div>
      <div class="stat-card"><div class="stat-value" id="statDue">-</div><div class="stat-label">待复习</div></div>
      <div class="stat-card"><div class="stat-value" id="statMastered">-</div><div class="stat-label">已掌握</div></div>
      <div class="stat-card"><div class="stat-value" id="statAvg">-</div><div class="stat-label">平均掌握度</div></div>
    </div>

    <div class="card">
      <div class="card-title">掌握度趋势</div>
      <svg class="trend-svg" id="trendSvg" viewBox="0 0 300 120" preserveAspectRatio="none"></svg>
      <div class="hint-text" id="trendHint">完成复习后会记录掌握度变化</div>
    </div>

    <div class="card" id="topicsCard">
      <div class="card-title">薄弱知识点</div>
      <div id="topicsList"></div>
    </div>

    <div class="card">
      <div class="card-title">数据备份</div>
      <div class="flex gap-12">
        <button class="btn btn-secondary btn-sm" onclick="exportData()">导出数据 (JSON)</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('importFile').click()">导入数据</button>
        <input type="file" id="importFile" accept="application/json" class="hidden" onchange="importData(this)">
      </div>
      <p class="hint-text mt-12">导入前会自动备份当前数据库；导入采用参数化写入，不会造成注入或数据损坏。</p>
    </div>

    <div class="card">
      <div class="card-title">最近记录</div>
      <div id="recentList"></div>
    </div>
  </div>

  <!-- ── 错题页 ── -->
  <div id="page-problems" class="page">
    <div class="flex-between mb-8">
      <h2 style="font-size:18px">错题工作台</h2>
      <button class="btn btn-primary btn-sm" onclick="openProblemModal()">+ 新增题目</button>
    </div>
    <div class="flex gap-12 mb-8">
      <div class="form-group" style="flex:1;margin:0">
        <input type="text" id="searchInput" placeholder="搜索标题、知识点、课程..." aria-label="搜索题目">
      </div>
      <div class="form-group" style="margin:0">
        <select id="sortSelect" aria-label="排序方式" onchange="loadProblems(1)">
          <option value="time">按时间</option>
          <option value="mastery">按掌握度</option>
        </select>
      </div>
    </div>
    <div id="problemsList"></div>
    <div class="flex gap-12 mt-12" id="pager" style="justify-content:center"></div>
  </div>

  <!-- ── 复习页 ── -->
  <div id="page-review" class="page">
    <h2 style="font-size:18px;margin-bottom:14px">今日复习</h2>
    <div id="reviewList"></div>
  </div>

  <!-- ── 口试页 ── -->
  <div id="page-oral" class="page">
    <h2 style="font-size:18px;margin-bottom:14px">AI 口试</h2>
    <div class="card" id="oralStartCard">
      <div class="card-title">开始口试</div>
      <p class="text-sm text-muted mb-8">输入一个知识点，AI 将围绕它进行五轮追问，检验你是否真正理解。</p>
      <div class="form-group">
        <input type="text" id="oralTopic" placeholder="例如：刚体转动惯量" onkeydown="if(event.key==='Enter')startOral()">
      </div>
      <button class="btn btn-primary" onclick="startOral()">开始口试</button>
    </div>
    <div class="card hidden" id="oralChatCard">
      <div class="flex-between mb-8">
        <div class="card-title" id="oralTopicDisplay" style="margin:0"></div>
        <span class="text-sm text-muted" id="oralTurn"></span>
      </div>
      <div class="chat-box" id="oralChat"></div>
      <div class="form-group">
        <textarea id="oralAnswer" placeholder="输入你的回答..." rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();respondOral()}"></textarea>
      </div>
      <button class="btn btn-primary" onclick="respondOral()">回答</button>
      <button class="btn btn-secondary" onclick="resetOral()">重新开始</button>
    </div>
  </div>

  <!-- ── 设置页 ── -->
  <div id="page-settings" class="page">
    <div class="card">
      <div class="card-title">AI 设置</div>
      <div class="form-group">
        <label for="setApiBase">API 地址</label>
        <input type="text" id="setApiBase" placeholder="https://api.openai.com/v1">
      </div>
      <div class="form-group">
        <label for="setApiKey">API Key</label>
        <input type="password" id="setApiKey" placeholder="sk-...">
        <p class="hint-text">密钥仅保存在本次运行的内存中（重启后失效），不会写入数据库文件。</p>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="setModel">模型名称</label>
          <input type="text" id="setModel" placeholder="gpt-4o-mini">
        </div>
        <div class="form-group">
          <label for="setTemp">Temperature</label>
          <input type="text" id="setTemp" placeholder="0.3">
        </div>
      </div>
      <div class="flex gap-12">
        <button class="btn btn-primary" onclick="saveSettings()">保存</button>
        <button class="btn btn-secondary" onclick="testSettings()">测试连接</button>
      </div>
      <p class="text-sm text-muted mt-12" id="keyStatus"></p>
    </div>
  </div>

</div>

<!-- ── 题目详情弹窗 ── -->
<div class="modal-overlay" id="problemModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h3 id="modalTitle">题目详情</h3>
      <button class="modal-close" onclick="closeModal('problemModal')" aria-label="关闭">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ── 新增/编辑弹窗 ── -->
<div class="modal-overlay" id="editModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="modal-header">
      <h3 id="editModalTitle">新增题目</h3>
      <button class="modal-close" onclick="closeModal('editModal')" aria-label="关闭">&times;</button>
    </div>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label for="editTitle">标题 *</label>
      <input type="text" id="editTitle">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="editCourse">课程</label>
        <input type="text" id="editCourse" placeholder="大学物理">
      </div>
      <div class="form-group">
        <label for="editTopic">知识点</label>
        <input type="text" id="editTopic" placeholder="刚体力学">
      </div>
    </div>
    <div class="form-group">
      <label for="editContent">题目内容 *</label>
      <textarea id="editContent" rows="4"></textarea>
    </div>
    <div class="form-group">
      <label for="editAttempt">我的尝试</label>
      <textarea id="editAttempt" rows="3" placeholder="写出你自己的解题过程..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="editErrorType">错误类型</label>
        <select id="editErrorType">
          <option value="待诊断">待诊断</option>
          <option value="概念错误">概念错误</option>
          <option value="计算错误">计算错误</option>
          <option value="适用条件">适用条件</option>
          <option value="符号/方向">符号/方向</option>
          <option value="建模错误">建模错误</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label for="editMastery">掌握度 (1-5，题目自身)</label>
        <select id="editMastery">
          <option value="1">1 - 完全不会</option>
          <option value="2">2 - 有思路</option>
          <option value="3">3 - 基本会做</option>
          <option value="4">4 - 熟练</option>
          <option value="5">5 - 精通</option>
        </select>
        <p class="hint-text">注：复习评分采用 1-4 分制（忘记/模糊/基本正确/完全掌握），与上面 1-5 的「题目掌握度」是两套独立指标。</p>
      </div>
    </div>
    <div class="flex gap-12 mt-12">
      <button class="btn btn-primary" onclick="saveProblem()">保存</button>
      <button class="btn btn-secondary" onclick="closeModal('editModal')">取消</button>
    </div>
  </div>
</div>

<!-- ── 确认弹窗 ── -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal" role="alertdialog" aria-modal="true" style="max-width:400px">
    <div class="modal-header"><h3 id="confirmTitle">确认</h3></div>
    <p class="text-sm" id="confirmMsg"></p>
    <div class="flex gap-12 mt-16" style="justify-content:flex-end">
      <button class="btn btn-secondary" id="confirmCancel">取消</button>
      <button class="btn btn-danger" id="confirmOk">确定</button>
    </div>
  </div>
</div>

</body>
</html>
