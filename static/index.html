<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人物理学习 OS</title>
<style>
  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --border: #e2e6ea;
    --text: #1a1a2e;
    --text-2: #6c757d;
    --accent: #3b82f6;
    --accent-light: #dbeafe;
    --danger: #ef4444;
    --danger-light: #fee2e2;
    --success: #10b981;
    --success-light: #d1fae5;
    --warning: #f59e0b;
    --warning-light: #fef3c7;
    --radius: 10px;
    --mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  a { color: var(--accent); text-decoration: none; }

  /* ── 导航 ── */
  .nav { display: flex; gap: 0; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .nav-item { padding: 14px 22px; cursor: pointer; border-bottom: 2px solid transparent; font-size: 14px; font-weight: 500; color: var(--text-2); transition: all .15s; }
  .nav-item:hover { color: var(--text); background: var(--bg); }
  .nav-item.active { color: var(--accent); border-bottom-color: var(--accent); }
  .nav-brand { margin-right: auto; padding: 14px 22px; font-weight: 700; font-size: 16px; color: var(--text); }

  /* ── 布局 ── */
  .container { max-width: 960px; margin: 0 auto; padding: 24px 20px; }
  .page { display: none; }
  .page.active { display: block; }

  /* ── 卡片 ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; }

  /* ── 统计卡片 ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 12px; color: var(--text-2); margin-top: 4px; }

  /* ── 表单 ── */
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--text-2); }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text);
    transition: border-color .15s;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
  .form-group textarea { min-height: 80px; resize: vertical; font-family: var(--mono); font-size: 13px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── 按钮 ── */
  .btn { display: inline-block; padding: 8px 18px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s; font-family: inherit; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--bg); }
  .btn-danger { background: var(--danger-light); color: var(--danger); }
  .btn-danger:hover { background: #fecaca; }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── 列表 ── */
  .list-item { padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: all .15s; }
  .list-item:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(59,130,246,.1); }
  .list-item-header { display: flex; justify-content: space-between; align-items: center; }
  .list-item-title { font-weight: 500; font-size: 14px; }
  .list-item-meta { font-size: 12px; color: var(--text-2); margin-top: 4px; }

  /* ── 标签 ── */
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .tag-blue { background: var(--accent-light); color: #1e40af; }
  .tag-green { background: var(--success-light); color: #065f46; }
  .tag-red { background: var(--danger-light); color: #991b1b; }
  .tag-amber { background: var(--warning-light); color: #92400e; }
  .tag-gray { background: #f3f4f6; color: #4b5563; }

  /* ── 提示卡片 ── */
  .hint-card { padding: 16px; border-left: 3px solid var(--accent); background: var(--accent-light); border-radius: 0 8px 8px 0; margin-bottom: 10px; }
  .hint-card h4 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  .hint-card p { font-size: 14px; white-space: pre-wrap; }

  /* ── 掌握度 ── */
  .mastery-bar { display: flex; gap: 3px; }
  .mastery-dot { width: 18px; height: 6px; border-radius: 3px; background: var(--border); }
  .mastery-dot.filled { background: var(--success); }

  /* ── 口试 ── */
  .chat-box { max-height: 400px; overflow-y: auto; padding: 12px; background: var(--bg); border-radius: 8px; margin-bottom: 12px; }
  .chat-msg { margin-bottom: 10px; max-width: 80%; }
  .chat-msg.assistant { }
  .chat-msg.user { margin-left: auto; text-align: right; }
  .chat-msg .bubble { display: inline-block; padding: 8px 14px; border-radius: 12px; font-size: 14px; }
  .chat-msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); }
  .chat-msg.user .bubble { background: var(--accent); color: #fff; }

  /* ── 空状态 ── */
  .empty { text-align: center; padding: 40px 20px; color: var(--text-2); }
  .empty p { font-size: 14px; }

  /* ── 弹窗 ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; display: none; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; padding: 24px; width: 90%; max-width: 560px; max-height: 85vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h3 { font-size: 16px; }
  .modal-close { cursor: pointer; font-size: 20px; color: var(--text-2); border: none; background: none; }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 300; animation: slideIn .3s; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .flex { display: flex; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .gap-8 { gap: 8px; }
  .gap-12 { gap: 12px; }
  .mt-12 { margin-top: 12px; }
  .mt-16 { margin-top: 16px; }
  .mb-8 { margin-bottom: 8px; }
  .text-sm { font-size: 13px; }
  .text-muted { color: var(--text-2); }
  .text-mono { font-family: var(--mono); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">物理学习 OS</div>
  <div class="nav-item active" data-page="dashboard">概览</div>
  <div class="nav-item" data-page="problems">错题</div>
  <div class="nav-item" data-page="review">复习</div>
  <div class="nav-item" data-page="oral">口试</div>
  <div class="nav-item" data-page="settings">设置</div>
</nav>

<div class="container">

  <!-- ── 概览页 ── -->
  <div id="page-dashboard" class="page active">
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-value" id="statTotal">-</div><div class="stat-label">题目总数</div></div>
      <div class="stat-card"><div class="stat-value" id="statDue">-</div><div class="stat-label">待复习</div></div>
      <div class="stat-card"><div class="stat-value" id="statMastered">-</div><div class="stat-label">已掌握</div></div>
      <div class="stat-card"><div class="stat-value" id="statAvg">-</div><div class="stat-label">平均掌握度</div></div>
    </div>

    <div class="card" id="topicsCard">
      <div class="card-title">薄弱知识点</div>
      <div id="topicsList"></div>
    </div>

    <div class="card">
      <div class="card-title">最近记录</div>
      <div id="recentList"></div>
    </div>
  </div>

  <!-- ── 错题页 ── -->
  <div id="page-problems" class="page">
    <div class="flex-between mb-8">
      <h2 style="font-size:18px">错题工作台</h2>
      <button class="btn btn-primary btn-sm" onclick="openProblemModal()">+ 新增题目</button>
    </div>
    <div class="form-group">
      <input type="text" id="searchInput" placeholder="搜索标题、知识点、课程..." oninput="renderProblems()">
    </div>
    <div id="problemsList"></div>
  </div>

  <!-- ── 复习页 ── -->
  <div id="page-review" class="page">
    <h2 style="font-size:18px;margin-bottom:14px">今日复习</h2>
    <div id="reviewList"></div>
  </div>

  <!-- ── 口试页 ── -->
  <div id="page-oral" class="page">
    <h2 style="font-size:18px;margin-bottom:14px">AI 口试</h2>
    <div class="card" id="oralStartCard">
      <div class="card-title">开始口试</div>
      <p class="text-sm text-muted mb-8">输入一个知识点，AI 将围绕它进行五轮追问，检验你是否真正理解。</p>
      <div class="form-group">
        <input type="text" id="oralTopic" placeholder="例如：刚体转动惯量" onkeydown="if(event.key==='Enter')startOral()">
      </div>
      <button class="btn btn-primary" onclick="startOral()">开始口试</button>
    </div>
    <div class="card hidden" id="oralChatCard">
      <div class="flex-between mb-8">
        <div class="card-title" id="oralTopicDisplay" style="margin:0"></div>
        <span class="text-sm text-muted" id="oralTurn"></span>
      </div>
      <div class="chat-box" id="oralChat"></div>
      <div class="form-group">
        <textarea id="oralAnswer" placeholder="输入你的回答..." rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();respondOral()}"></textarea>
      </div>
      <button class="btn btn-primary" onclick="respondOral()">回答</button>
    </div>
  </div>

  <!-- ── 设置页 ── -->
  <div id="page-settings" class="page">
    <div class="card">
      <div class="card-title">AI 设置</div>
      <div class="form-group">
        <label>API 地址</label>
        <input type="text" id="setApiBase" placeholder="https://api.openai.com/v1">
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="setApiKey" placeholder="sk-...">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>模型名称</label>
          <input type="text" id="setModel" placeholder="gpt-4o-mini">
        </div>
        <div class="form-group">
          <label>Temperature</label>
          <input type="text" id="setTemp" placeholder="0.3">
        </div>
      </div>
      <div class="flex gap-12">
        <button class="btn btn-primary" onclick="saveSettings()">保存</button>
        <button class="btn btn-secondary" onclick="testSettings()">测试连接</button>
      </div>
      <p class="text-sm text-muted mt-12" id="keyStatus"></p>
    </div>
  </div>

</div>

<!-- ── 题目详情弹窗 ── -->
<div class="modal-overlay" id="problemModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">题目详情</h3>
      <button class="modal-close" onclick="closeProblemModal()">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ── 新增/编辑弹窗 ── -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="editModalTitle">新增题目</h3>
      <button class="modal-close" onclick="closeEditModal()">&times;</button>
    </div>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label>标题 *</label>
      <input type="text" id="editTitle">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>课程</label>
        <input type="text" id="editCourse" placeholder="大学物理">
      </div>
      <div class="form-group">
        <label>知识点</label>
        <input type="text" id="editTopic" placeholder="刚体力学">
      </div>
    </div>
    <div class="form-group">
      <label>题目内容 *</label>
      <textarea id="editContent" rows="4"></textarea>
    </div>
    <div class="form-group">
      <label>我的尝试</label>
      <textarea id="editAttempt" rows="3" placeholder="写出你自己的解题过程..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>错误类型</label>
        <select id="editErrorType">
          <option value="待诊断">待诊断</option>
          <option value="概念错误">概念错误</option>
          <option value="计算错误">计算错误</option>
          <option value="适用条件">适用条件</option>
          <option value="符号/方向">符号/方向</option>
          <option value="建模错误">建模错误</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>掌握度 (1-5)</label>
        <select id="editMastery">
          <option value="1">1 - 完全不会</option>
          <option value="2">2 - 有思路</option>
          <option value="3">3 - 基本会做</option>
          <option value="4">4 - 熟练</option>
          <option value="5">5 - 精通</option>
        </select>
      </div>
    </div>
    <div class="flex gap-12 mt-12">
      <button class="btn btn-primary" onclick="saveProblem()">保存</button>
      <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
    </div>
  </div>
</div>

<script>
// ── 工具函数 ──
const API = '';
async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function masteryBar(level) {
  let html = '<div class="mastery-bar">';
  for (let i = 1; i <= 5; i++) html += `<div class="mastery-dot ${i <= level ? 'filled' : ''}"></div>`;
  return html + '</div>';
}

function masteryTag(level) {
  const cls = level >= 4 ? 'tag-green' : level >= 3 ? 'tag-blue' : level >= 2 ? 'tag-amber' : 'tag-red';
  const labels = {1:'完全不会',2:'有思路',3:'基本会做',4:'熟练',5:'精通'};
  return `<span class="tag ${cls}">${labels[level]||'未知'}</span>`;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ── 导航 ──
let allProblems = [];
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('page-' + el.dataset.page).classList.add('active');
    if (el.dataset.page === 'dashboard') loadDashboard();
    if (el.dataset.page === 'problems') loadProblems();
    if (el.dataset.page === 'review') loadReviews();
    if (el.dataset.page === 'settings') loadSettings();
  });
});

// ── 概览 ──
async function loadDashboard() {
  try {
    const d = await api('/api/dashboard');
    document.getElementById('statTotal').textContent = d.stats.total || 0;
    document.getElementById('statDue').textContent = d.due || 0;
    document.getElementById('statMastered').textContent = d.stats.mastered || 0;
    document.getElementById('statAvg').textContent = (d.stats.avg_mastery || 0).toFixed(1);

    const topicsEl = document.getElementById('topicsList');
    if (d.topics && d.topics.length) {
      topicsEl.innerHTML = d.topics.map(t => `
        <div class="flex-between mb-8">
          <span class="text-sm">${escapeHtml(t.topic)}</span>
          <span class="flex gap-8 items-center">
            <span class="tag tag-gray">${t.count}题</span>
            ${masteryBar(t.mastery)}
          </span>
        </div>`).join('');
    } else {
      topicsEl.innerHTML = '<div class="empty"><p>暂无知识点数据</p></div>';
    }

    const recentEl = document.getElementById('recentList');
    if (d.recent && d.recent.length) {
      recentEl.innerHTML = d.recent.map(p => `
        <div class="list-item" onclick="viewProblem(${p.id})">
          <div class="list-item-header">
            <span class="list-item-title">${escapeHtml(p.title)}</span>
            ${masteryTag(p.mastery)}
          </div>
          <div class="list-item-meta">${escapeHtml(p.course)} · ${escapeHtml(p.topic)} · ${p.error_type}</div>
        </div>`).join('');
    } else {
      recentEl.innerHTML = '<div class="empty"><p>还没有记录，去"错题"页添加第一题吧</p></div>';
    }
  } catch(e) { toast(e.message, 'error'); }
}

// ── 错题 ──
async function loadProblems() {
  try {
    allProblems = await api('/api/problems');
    renderProblems();
  } catch(e) { toast(e.message, 'error'); }
}

function renderProblems() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allProblems.filter(p =>
    !q || (p.title||'').toLowerCase().includes(q) || (p.topic||'').toLowerCase().includes(q) || (p.course||'').toLowerCase().includes(q)
  );
  const el = document.getElementById('problemsList');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><p>暂无题目，点击"新增题目"开始</p></div>';
    return;
  }
  el.innerHTML = filtered.map(p => `
    <div class="list-item" onclick="viewProblem(${p.id})">
      <div class="list-item-header">
        <span class="list-item-title">${escapeHtml(p.title)}</span>
        ${masteryTag(p.mastery)}
      </div>
      <div class="list-item-meta">${escapeHtml(p.course)} · ${escapeHtml(p.topic)} · ${escapeHtml(p.error_type)} · ${p.created_at}</div>
    </div>`).join('');
}

async function viewProblem(id) {
  try {
    const p = await api(`/api/problems/${id}`);
    document.getElementById('modalTitle').textContent = p.title;
    let html = `
      <div class="flex gap-8 mb-8">
        <span class="tag tag-blue">${escapeHtml(p.course||'未分类')}</span>
        <span class="tag tag-gray">${escapeHtml(p.topic||'无知识点')}</span>
        ${masteryTag(p.mastery)}
      </div>
      <div class="card" style="border-color:var(--border);margin-bottom:12px">
        <div class="card-title">题目内容</div>
        <p class="text-mono text-sm" style="white-space:pre-wrap">${escapeHtml(p.content)}</p>
      </div>`;
    if (p.my_attempt) {
      html += `<div class="card" style="border-color:var(--border);margin-bottom:12px">
        <div class="card-title">我的尝试</div>
        <p class="text-mono text-sm" style="white-space:pre-wrap">${escapeHtml(p.my_attempt)}</p>
      </div>`;
    }
    html += `<div class="card-title mt-16">分级提示</div>
      <div class="flex gap-12 mb-8">
        <button class="btn btn-secondary btn-sm" onclick="getHint(${id},1)" id="hint1btn">一级提示</button>
        <button class="btn btn-secondary btn-sm" onclick="getHint(${id},2)" id="hint2btn">二级提示</button>
        <button class="btn btn-secondary btn-sm" onclick="getHint(${id},3)" id="hint3btn">三级提示</button>
      </div>
      <div id="hintsArea"></div>`;
    if (p.hints && p.hints.length) {
      p.hints.forEach(h => {
        html += `<div class="hint-card"><h4>第 ${h.level} 级提示</h4><p>${escapeHtml(h.content)}</p></div>`;
      });
    }
    html += `<div class="flex gap-12 mt-16">
      <button class="btn btn-secondary btn-sm" onclick="editProblem(${id})">编辑</button>
      <button class="btn btn-danger btn-sm" onclick="deleteProblem(${id})">删除</button>
    </div>`;
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('problemModal').classList.add('active');
  } catch(e) { toast(e.message, 'error'); }
}

async function getHint(id, level) {
  const btn = document.getElementById(`hint${level}btn`);
  btn.disabled = true; btn.textContent = '加载中...';
  try {
    const r = await api(`/api/problems/${id}/hint`, { method: 'POST', body: { level } });
    const area = document.getElementById('hintsArea');
    const srcTag = r.source === 'ai' ? '<span class="tag tag-green">AI</span>' :
                   r.source === 'fallback' ? '<span class="tag tag-amber">降级</span>' : '<span class="tag tag-gray">缓存</span>';
    area.innerHTML += `<div class="hint-card"><h4>第 ${level} 级提示 ${srcTag}</h4><p>${escapeHtml(r.content)}</p></div>`;
    btn.textContent = '已查看'; btn.style.opacity = '0.5';
  } catch(e) {
    toast(e.message, 'error'); btn.disabled = false; btn.textContent = `第${'一二三'[level-1]}级提示`;
  }
}

function openProblemModal() { editProblem(null); }

async function editProblem(id) {
  const modal = document.getElementById('editModal');
  const titleEl = document.getElementById('editModalTitle');
  if (id) {
    titleEl.textContent = '编辑题目';
    try {
      const p = await api(`/api/problems/${id}`);
      document.getElementById('editId').value = p.id;
      document.getElementById('editTitle').value = p.title || '';
      document.getElementById('editCourse').value = p.course || '';
      document.getElementById('editTopic').value = p.topic || '';
      document.getElementById('editContent').value = p.content || '';
      document.getElementById('editAttempt').value = p.my_attempt || '';
      document.getElementById('editErrorType').value = p.error_type || '待诊断';
      document.getElementById('editMastery').value = p.mastery || 1;
    } catch(e) { toast(e.message, 'error'); return; }
  } else {
    titleEl.textContent = '新增题目';
    document.getElementById('editId').value = '';
    ['editTitle','editCourse','editTopic','editContent','editAttempt'].forEach(i => document.getElementById(i).value = '');
    document.getElementById('editErrorType').value = '待诊断';
    document.getElementById('editMastery').value = 1;
  }
  modal.classList.add('active');
}

function closeEditModal() { document.getElementById('editModal').classList.remove('active'); }
function closeProblemModal() { document.getElementById('problemModal').classList.remove('active'); }

async function saveProblem() {
  const id = document.getElementById('editId').value;
  const body = {
    title: document.getElementById('editTitle').value,
    course: document.getElementById('editCourse').value,
    topic: document.getElementById('editTopic').value,
    content: document.getElementById('editContent').value,
    my_attempt: document.getElementById('editAttempt').value,
    error_type: document.getElementById('editErrorType').value,
    mastery: parseInt(document.getElementById('editMastery').value),
  };
  if (!body.title.trim() || !body.content.trim()) { toast('标题和题目内容不能为空', 'error'); return; }
  try {
    if (id) {
      await api(`/api/problems/${id}`, { method: 'PUT', body });
    } else {
      await api('/api/problems', { method: 'POST', body });
    }
    toast(id ? '已更新' : '已创建');
    closeEditModal();
    loadProblems();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteProblem(id) {
  if (!confirm('确定删除这道题目？相关提示和复习记录也会被删除。')) return;
  try {
    await api(`/api/problems/${id}`, { method: 'DELETE' });
    toast('已删除');
    closeProblemModal();
    loadProblems();
  } catch(e) { toast(e.message, 'error'); }
}

// ── 复习 ──
async function loadReviews() {
  try {
    const list = await api('/api/reviews');
    const el = document.getElementById('reviewList');
    if (!list.length) {
      el.innerHTML = '<div class="empty"><p>今天没有待复习的题目，去看看概览页吧</p></div>';
      return;
    }
    el.innerHTML = list.map(r => `
      <div class="list-item">
        <div class="list-item-header">
          <span class="list-item-title">${escapeHtml(r.title)}</span>
          <span class="tag ${r.due_date <= new Date().toISOString().slice(0,10) ? 'tag-red' : 'tag-gray'}">
            ${r.due_date <= new Date().toISOString().slice(0,10) ? '今日到期' : '即将到期'}
          </span>
        </div>
        <div class="list-item-meta">${escapeHtml(r.course)} · ${escapeHtml(r.topic)} · 到期日: ${r.due_date}</div>
        <div class="flex gap-8 mt-12">
          <button class="btn btn-danger btn-sm" onclick="completeReview(${r.id},1)">忘记</button>
          <button class="btn btn-secondary btn-sm" onclick="completeReview(${r.id},2)">模糊</button>
          <button class="btn btn-secondary btn-sm" onclick="completeReview(${r.id},3)">基本正确</button>
          <button class="btn btn-primary btn-sm" onclick="completeReview(${r.id},4)">完全掌握</button>
          <button class="btn btn-secondary btn-sm" onclick="viewProblem(${r.problem_id})">查看题目</button>
        </div>
      </div>`).join('');
  } catch(e) { toast(e.message, 'error'); }
}

async function completeReview(id, rating) {
  try {
    const r = await api(`/api/reviews/${id}/complete`, { method: 'POST', body: { rating } });
    const labels = {1:'已标记为忘记',2:'已标记为模糊',3:'已标记为基本正确',4:'已标记为完全掌握'};
    toast(`${labels[rating]} · 下次复习: ${r.next_due} (${r.interval_days}天后)`);
    loadReviews();
  } catch(e) { toast(e.message, 'error'); }
}

// ── 口试 ──
let oralSessionId = null;
let oralTurn = 0;

async function startOral() {
  const topic = document.getElementById('oralTopic').value.trim();
  if (!topic) { toast('请输入口试主题', 'error'); return; }
  try {
    const r = await api('/api/oral/start', { method: 'POST', body: { topic } });
    oralSessionId = r.session_id;
    oralTurn = 1;
    document.getElementById('oralStartCard').classList.add('hidden');
    document.getElementById('oralChatCard').classList.remove('hidden');
    document.getElementById('oralTopicDisplay').textContent = `主题: ${topic}`;
    document.getElementById('oralTurn').textContent = `第 1 / 5 轮`;
    document.getElementById('oralChat').innerHTML = `<div class="chat-msg assistant"><div class="bubble">${escapeHtml(r.reply)}</div></div>`;
    document.getElementById('oralAnswer').value = '';
    document.getElementById('oralAnswer').focus();
  } catch(e) { toast(e.message, 'error'); }
}

async function respondOral() {
  const answer = document.getElementById('oralAnswer').value.trim();
  if (!answer) return;
  const chatEl = document.getElementById('oralChat');
  chatEl.innerHTML += `<div class="chat-msg user"><div class="bubble">${escapeHtml(answer)}</div></div>`;
  chatEl.scrollTop = chatEl.scrollHeight;
  document.getElementById('oralAnswer').value = '';
  document.getElementById('oralAnswer').disabled = true;
  try {
    const r = await api('/api/oral/respond', { method: 'POST', body: { session_id: oralSessionId, answer } });
    oralTurn++;
    chatEl.innerHTML += `<div class="chat-msg assistant"><div class="bubble">${escapeHtml(r.reply)}</div></div>`;
    chatEl.scrollTop = chatEl.scrollHeight;
    if (r.finished) {
      document.getElementById('oralTurn').textContent = '口试已结束';
      document.getElementById('oralAnswer').placeholder = '口试已结束，可重新开始';
    } else {
      document.getElementById('oralTurn').textContent = `第 ${oralTurn} / 5 轮`;
      document.getElementById('oralAnswer').disabled = false;
      document.getElementById('oralAnswer').focus();
    }
  } catch(e) {
    toast(e.message, 'error');
    document.getElementById('oralAnswer').disabled = false;
  }
}

function resetOral() {
  oralSessionId = null; oralTurn = 0;
  document.getElementById('oralStartCard').classList.remove('hidden');
  document.getElementById('oralChatCard').classList.add('hidden');
  document.getElementById('oralTopic').value = '';
}

// ── 设置 ──
async function loadSettings() {
  try {
    const s = await api('/api/settings');
    document.getElementById('setApiBase').value = s.api_base || '';
    document.getElementById('setApiKey').value = '';
    document.getElementById('setApiKey').placeholder = s.has_api_key ? '••••••••（已配置，留空则不变）' : 'sk-...';
    document.getElementById('setModel').value = s.model || '';
    document.getElementById('setTemp').value = s.temperature || '0.3';
    document.getElementById('keyStatus').textContent = s.key_source === 'environment'
      ? '当前使用环境变量中的密钥（优先级高于本地配置）'
      : (s.has_api_key ? '密钥已配置（存储在本地数据库）' : '尚未配置密钥');
  } catch(e) { toast(e.message, 'error'); }
}

async function saveSettings() {
  const body = {
    api_base: document.getElementById('setApiBase').value,
    model: document.getElementById('setModel').value,
    temperature: document.getElementById('setTemp').value,
  };
  const key = document.getElementById('setApiKey').value;
  if (key) body.api_key = key;
  try {
    await api('/api/settings', { method: 'PUT', body });
    toast('设置已保存');
    loadSettings();
  } catch(e) { toast(e.message, 'error'); }
}

async function testSettings() {
  try {
    const r = await api('/api/settings/test', { method: 'POST', body: {} });
    if (r.ok) toast('连接成功: ' + r.reply);
  } catch(e) { toast('连接失败: ' + e.message, 'error'); }
}

// ── 初始化 ──
loadDashboard();
